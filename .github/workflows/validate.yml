name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run deterministic checks
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tests\project-check.tests.ps1
