name: Bug report
description: Report a reproducible Living Room TV defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private Favorites, credentials, personal paths, or unsanitized logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows, browser, display mode, and input method.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add safe screenshots or output and state what physical testing occurred.
